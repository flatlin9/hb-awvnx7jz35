<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2a8fd6">
<link rel="icon" href="data:,">
<title>Hey Billy Run</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
 background:linear-gradient(180deg,#6fc3ff 0%,#a8e0ff 55%,#7ed36b 55%,#5cb84a 100%);
 display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px;color:#21324a;overflow:hidden}
.cloud{position:fixed;background:#fff;border-radius:60px;opacity:.9;animation:drift linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1{width:120px;height:40px;top:12%;left:-140px;animation-duration:28s}
.c1:before{width:60px;height:60px;top:-30px;left:18px}.c1:after{width:46px;height:46px;top:-20px;left:62px}
.c2{width:90px;height:30px;top:26%;left:-120px;animation-duration:38s;animation-delay:-14s}
.c2:before{width:44px;height:44px;top:-22px;left:14px}.c2:after{width:34px;height:34px;top:-14px;left:48px}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}
.card{position:relative;background:#fff;border-radius:28px;padding:28px 22px 24px;width:100%;max-width:380px;text-align:center;
 box-shadow:0 10px 0 #1d6fb0,0 18px 40px rgba(0,0,0,.25);border:4px solid #21324a}
.run{font-size:56px;line-height:1;display:inline-block;animation:bounce .6s ease-in-out infinite alternate}
@keyframes bounce{to{transform:translateY(-10px) rotate(-6deg)}}
h1{margin:8px 0 4px;font-size:34px;letter-spacing:.5px;color:#ff5a36;text-shadow:3px 3px 0 #ffd23f}
p{margin:0 0 18px;font-size:18px}
input{width:100%;font:inherit;font-size:34px;text-align:center;letter-spacing:12px;padding:14px 10px;border:4px solid #21324a;border-radius:18px;outline:none;background:#fffbe6}
input:focus{border-color:#2a8fd6;box-shadow:0 0 0 4px #bfe4ff}
button{margin-top:16px;width:100%;font:inherit;font-size:26px;font-weight:800;color:#fff;background:#ff5a36;border:4px solid #21324a;border-radius:18px;padding:14px;
 box-shadow:0 6px 0 #21324a;cursor:pointer;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #21324a}
button:disabled{opacity:.7}
.err{min-height:26px;margin-top:14px;font-size:17px;color:#c0392b;font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<form class="card" id="hbForm" autocomplete="off">
 <div class="run">🏃‍♂️💨</div>
 <h1>Hey Billy Run!</h1>
 <p>Enter the family password</p>
 <input id="hbPw" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" autocomplete="off" aria-label="Family password" placeholder="••••" autofocus>
 <button id="hbGo" type="submit">Let's Go! 🚀</button>
 <div class="err" id="hbErr" role="alert"></div>
</form>
